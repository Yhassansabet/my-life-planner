<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Life Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f7f8fc;color:#202638;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}.main{width:min(920px,100%);margin:0 auto;padding:52px 24px 40px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:30px}h1{font-size:42px;line-height:1.05;letter-spacing:-1.5px;margin:0;font-weight:800}.subtitle{font-size:17px;line-height:1.45;color:#7b8392;margin-top:10px}.add{border:0;background:#6d5dfc;color:white;font-size:16px;font-weight:700;border-radius:14px;padding:15px 20px;white-space:nowrap}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;box-shadow:0 8px 30px rgba(28,35,55,.06);overflow:hidden}.item{display:grid;grid-template-columns:125px 1fr auto;align-items:center;gap:20px;padding:20px 22px;border-bottom:1px solid #edf0f4}.item:last-child{border-bottom:0}.year-divider{padding:28px 22px 12px;background:#fff;border-bottom:1px solid #edf0f4}.year-divider span{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6d5dfc;background:#f0edff;padding:7px 12px;border-radius:999px}.date{font-size:15px;font-weight:800;color:#252c3d}.relative{display:block;font-size:11px;color:#9aa1af;font-weight:500;margin-top:4px}.name{font-size:16px;font-weight:700}.location{display:block;font-size:12px;color:#818999;margin-top:5px}.badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-radius:999px}.personal{background:#eeeaff;color:#6655e8}.health{background:#e9f8ef;color:#29824f}.travel{background:#e7f3ff;color:#347fbd}.important{background:#fff0e5;color:#bd6b28}.sport{background:#e8f4ff;color:#347fbd}.entertainment{background:#f3eaff;color:#8b5bc2}.done .name,.done .date{text-decoration:line-through;opacity:.55}.done .location{opacity:.55}.done .badge{opacity:.6}.empty{padding:28px 22px;color:#8a91a0;font-size:15px}@media(max-width:600px){.main{padding:38px 16px 30px}.header{display:block}h1{font-size:38px}.subtitle{font-size:16px;max-width:330px}.add{margin-top:18px;width:100%;padding:14px}.item{grid-template-columns:92px 1fr;gap:14px;padding:17px 16px}.badge{display:none}.name{font-size:15px}.date{font-size:13px}}
</style>
</head>
<body>
<main class="main">
<header class="header"><div><h1>Coming up</h1><div class="subtitle">Everything ahead, in chronological order.</div></div><div class="add">My Life Planner</div></header>
<section class="card" id="planner"></section>
</main>
<script>
const events=[
{id:1,start:'2026-09-07',name:'General doctor for Health Analysis',cat:'health'},
{id:2,start:'2026-09-08',name:'Health CheckUp',cat:'health'},
{id:3,start:'2026-09-09',end:'2026-09-20',name:'Egypt 🇪🇬',location:'Egypt',cat:'travel'},
{id:4,start:'2026-09-10',name:'Do InBody and shave',cat:'health'},
{id:5,start:'2026-09-10',name:"Kassrawy's Birthday 🎂",cat:'personal'},
{id:6,start:'2026-09-11',name:"Zein's birthday 🎂",location:'Egypt',cat:'personal'},
{id:7,start:'2026-09-12',name:"Ali's Birthday 🎂",cat:'personal'},
{id:8,start:'2026-09-12',name:'CF',cat:'personal'},
{id:9,start:'2026-09-14',name:'Rover interview',cat:'important'},
{id:10,start:'2026-09-15',name:'Ifta meeting',cat:'important'},
{id:11,start:'2026-09-15',name:'Al Ahly football match ⚽',cat:'sport'},
{id:12,start:'2026-09-18',name:"Ghanem's wedding 💍",location:'Egypt',cat:'personal'},
{id:13,start:'2026-09-18',name:"Ghalia's birthday 🎂",location:'Egypt',cat:'personal'},
{id:14,start:'2026-09-21',end:'2026-09-23',name:'Zurich 🇨🇭',location:'Zurich',cat:'travel'},
{id:15,start:'2026-09-23',name:'Arriving to Madrid ✈️',location:'Madrid',cat:'travel'},
{id:16,start:'2026-09-24',name:"Madison's wedding 💍",location:'Madrid',cat:'personal'},
{id:17,start:'2026-10-01',name:'Nutri appointment',location:'Tarragona',cat:'health'},
{id:18,start:'2026-10-07',name:'Cita Adeslas Dental 🦷',location:'Tarragona',cat:'health'},
{id:19,start:'2026-11-08',name:'Half Marathon 🏃',location:'Tarragona',cat:'sport'},
{id:20,start:'2026-11-28',name:"Shakira's concert 🎤",location:'Cairo',cat:'entertainment'},
{id:21,start:'2026-11-28',name:"Saint Levant's concert 🎤",location:'Barcelona',cat:'entertainment'},
{id:22,start:'2026-11-29',end:'2026-12-02',name:'Sheraton Miramar Resort El Gouna 🏨',location:'El Gouna, Egypt',cat:'travel'},
{id:23,start:'2026-12-03',name:'Flight from Cairo to Barcelona ✈️',location:'Cairo → Barcelona',cat:'travel'},
{id:24,start:'2026-12-09',end:'2026-12-11',name:'EoY Party 🎉',location:'Zurich',cat:'personal'},
{id:25,start:'2027-01-19',name:'Nationality Jura 🇪🇸',location:'Tarragona',cat:'important'},
{id:26,start:'2027-02-07',end:'2027-03-08',name:'Ramadan 🌙',cat:'personal'},
{id:27,start:'2027-02-14',name:'Half Marathon 🏃',location:'Barcelona',cat:'sport'},
{id:28,start:'2027-03-14',name:'Marathon 🏃',location:'Barcelona',cat:'sport'},
{id:29,start:'2027-06-05',name:"Sonia's wedding 💍",cat:'personal'}
];
const catLabel={personal:'Personal',health:'Health',travel:'Travel',important:'Important',sport:'Sport',entertainment:'Entertainment'};
const dateObj=s=>new Date(s+'T00:00:00');
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtDate(e){const s=dateObj(e.start),end=e.end?dateObj(e.end):null,months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const a=s.getDate()+' '+months[s.getMonth()];if(!end)return a;return a+'–'+end.getDate()+' '+months[end.getMonth()];}
function row(e,done=false){return `<div class="item ${done?'done':''}"><div class="date">${fmtDate(e)}<span class="relative">${dateObj(e.start).getFullYear()}</span></div><div><div class="name">${e.name}</div>${e.location?`<span class="location">📍 ${e.location}</span>`:''}</div><span class="badge ${e.cat}">${done?'Done':catLabel[e.cat]}</span></div>`;}
function render(){
 const t=today();
 const upcoming=events.filter(e=>(e.end?dateObj(e.end):dateObj(e.start))>=t).sort((a,b)=>dateObj(a.start)-dateObj(b.start)||a.id-b.id);
 const completed=events.filter(e=>(e.end?dateObj(e.end):dateObj(e.start))<t).sort((a,b)=>dateObj(b.start)-dateObj(a.start));
 let html='',lastYear=null;
 for(const e of upcoming){const y=dateObj(e.start).getFullYear();if(y!==lastYear){if(lastYear!==null)html+=`<div class="year-divider"><span>${y}</span></div>`;lastYear=y;}html+=row(e);}
 if(!upcoming.length)html='<div class="empty">No upcoming events.</div>';
 html+=`<div class="year-divider"><span>Completed</span></div>`;
 if(completed.length)for(const e of completed)html+=row(e,true);else html+='<div class="empty">Nothing completed yet.</div>';
 document.getElementById('planner').innerHTML=html;
}
render();
</script>
</body>
</html>
