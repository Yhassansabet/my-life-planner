<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Life Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=4', {updateViaCache:'none'}).then(r => r.update()).catch(()=>{});
}
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f7f8fc;color:#202638;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}.main{width:min(920px,100%);margin:0 auto;padding:52px 24px 40px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:30px}h1{font-size:42px;line-height:1.05;letter-spacing:-1.5px;margin:0;font-weight:800}.subtitle{font-size:17px;line-height:1.45;color:#7b8392;margin-top:10px}.add{border:0;background:#6d5dfc;color:white;font-size:16px;font-weight:700;border-radius:14px;padding:15px 20px;white-space:nowrap}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;box-shadow:0 8px 30px rgba(28,35,55,.06);overflow:hidden}.item{display:grid;grid-template-columns:125px 1fr auto;align-items:center;gap:20px;padding:20px 22px;border-bottom:1px solid #edf0f4}.item:last-child{border-bottom:0}.year-divider{padding:28px 22px 12px;background:#fff;border-bottom:1px solid #edf0f4}.year-divider span{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6d5dfc;background:#f0edff;padding:7px 12px;border-radius:999px}.date{font-size:15px;font-weight:800;color:#252c3d}.relative{display:block;font-size:11px;color:#9aa1af;font-weight:500;margin-top:4px}.name{font-size:16px;font-weight:700}.location{display:block;font-size:12px;color:#818999;margin-top:5px}.badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-radius:999px}.personal{background:#eeeaff;color:#6655e8}.health{background:#e9f8ef;color:#29824f}.travel{background:#e7f3ff;color:#347fbd}.important{background:#fff0e5;color:#bd6b28}.sport{background:#e8f4ff;color:#347fbd}.entertainment{background:#f3eaff;color:#8b5bc2}.item.done .name,.item.done .date{text-decoration:line-through;opacity:.55}.item.done .location{opacity:.55}.item.done .badge{opacity:.6}.empty{padding:24px 22px;color:#9aa1af;font-size:14px}@media(max-width:600px){.main{padding:38px 16px 30px}.header{display:block}h1{font-size:38px}.subtitle{font-size:16px;max-width:330px}.add{margin-top:18px;width:100%;padding:14px}.item{grid-template-columns:92px 1fr;gap:14px;padding:17px 16px}.badge{display:none}.name{font-size:15px}.date{font-size:13px}}
</style>
</head>
<body>
<main class="main">
<header class="header"><div><h1>Coming up</h1><div class="subtitle">Everything ahead, in chronological order.</div></div><div class="add">My Life Planner</div></header>
<section class="card" id="planner"></section>
</main>
<script>
const events = [
  {start:'2026-08-30',end:'2026-08-30',name:'Khalid & Maria visiting',type:'personal'},
  {start:'2026-08-31',end:'2026-08-31',name:'Meeting TJ & Marina',type:'personal'},
  {start:'2026-09-02',end:'2026-09-02',name:'Cita Adeslas Dental 🦷',location:'Tarragona',type:'health'},
  {start:'2026-09-03',end:'2026-09-03',name:'Nutritionist',type:'health'},
  {start:'2026-09-07',end:'2026-09-07',name:'General doctor for Health Analysis',type:'health'},
  {start:'2026-09-08',end:'2026-09-08',name:'Health CheckUp',type:'health'},
  {start:'2026-09-09',end:'2026-09-20',name:'Egypt 🇪🇬',location:'Egypt',type:'travel'},
  {start:'2026-09-10',end:'2026-09-10',name:'Do InBody and shave',type:'health'},
  {start:'2026-09-10',end:'2026-09-10',name:"Kassrawy's Birthday 🎂",type:'personal'},
  {start:'2026-09-11',end:'2026-09-11',name:"Zein's birthday 🎂",location:'Egypt',type:'personal'},
  {start:'2026-09-12',end:'2026-09-12',name:"Ali's Birthday 🎂",type:'personal'},
  {start:'2026-09-14',end:'2026-09-14',name:'Rover interview',type:'important'},
  {start:'2026-09-18',end:'2026-09-18',name:"Ghanem's wedding 💍",location:'Egypt',type:'personal'},
  {start:'2026-09-18',end:'2026-09-18',name:"Ghalia's birthday 🎂",location:'Egypt',type:'personal'},
  {start:'2026-09-21',end:'2026-09-23',name:'Zurich 🇨🇭',location:'Zurich',type:'travel'},
  {start:'2026-09-23',end:'2026-09-23',name:'Arriving to Madrid ✈️',location:'Madrid',type:'travel'},
  {start:'2026-09-24',end:'2026-09-24',name:"Madison's wedding 💍",location:'Madrid',type:'personal'},
  {start:'2026-10-01',end:'2026-10-01',name:'Nutri appointment',location:'Tarragona',type:'health'},
  {start:'2026-10-07',end:'2026-10-07',name:'Cita Adeslas Dental 🦷',location:'Tarragona',type:'health'},
  {start:'2026-11-08',end:'2026-11-08',name:'Half Marathon 🏃',location:'Tarragona',type:'sport'},
  {start:'2026-11-28',end:'2026-11-28',name:"Shakira's concert 🎤",location:'Cairo',type:'entertainment'},
  {start:'2026-11-28',end:'2026-11-28',name:"Saint Levant's concert 🎤",location:'Barcelona',type:'entertainment'},
  {start:'2026-11-29',end:'2026-12-02',name:'Sheraton Miramar Resort El Gouna 🏨',location:'El Gouna, Egypt',type:'travel'},
  {start:'2026-12-03',end:'2026-12-03',name:'Flight from Cairo to Barcelona ✈️',location:'Cairo → Barcelona',type:'travel'},
  {start:'2026-12-09',end:'2026-12-11',name:'EoY Party 🎉',location:'Zurich',type:'personal'},
  {start:'2027-01-19',end:'2027-01-19',name:'Nationality Jura 🇪🇸',location:'Tarragona',type:'important'},
  {start:'2027-02-07',end:'2027-03-08',name:'Ramadan 🌙',type:'personal'},
  {start:'2027-02-14',end:'2027-02-14',name:'Half Marathon 🏃',location:'Barcelona',type:'sport'},
  {start:'2027-03-14',end:'2027-03-14',name:'Marathon 🏃',location:'Barcelona',type:'sport'},
  {start:'2027-06-05',end:'2027-06-05',name:"Sonia's wedding 💍",type:'personal'}
];
const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function localDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function dateLabel(start,end){const a=localDate(start),b=localDate(end);const same=start===end;if(same)return `${a.getDate()} ${monthNames[a.getMonth()]}`;if(a.getMonth()===b.getMonth())return `${a.getDate()}–${b.getDate()} ${monthNames[a.getMonth()]}`;return `${a.getDate()} ${monthNames[a.getMonth()]} – ${b.getDate()} ${monthNames[b.getMonth()]}`}
function yearLabel(iso){return localDate(iso).getFullYear()}
function render(){
  const today=new Date();today.setHours(0,0,0,0);
  const upcoming=events.filter(e=>localDate(e.end)>=today).sort((a,b)=>a.start.localeCompare(b.start));
  const completed=events.filter(e=>localDate(e.end)<today).sort((a,b)=>b.end.localeCompare(a.end));
  const root=document.getElementById('planner');root.innerHTML='';
  let currentYear=null;
  const addDivider=y=>{const d=document.createElement('div');d.className='year-divider';d.innerHTML=`<span>${y}</span>`;root.appendChild(d)};
  const addItem=(e,done=false)=>{const el=document.createElement('div');el.className='item'+(done?' done':'');const y=yearLabel(e.start);el.innerHTML=`<div class="date">${dateLabel(e.start,e.end)}<span class="relative">${y}</span></div><div><div class="name">${e.name}</div>${e.location?`<span class="location">📍 ${e.location}</span>`:''}</div><span class="badge ${e.type}">${done?'✓ Done':e.type==='important'?'Important':e.type==='health'?'Health':e.type==='travel'?'Travel':e.type==='sport'?'Sport':e.type==='entertainment'?'Entertainment':'Personal'}</span>`;root.appendChild(el)};
  upcoming.forEach(e=>{const y=yearLabel(e.start);if(y!==currentYear){currentYear=y;if(y!==yearLabel(upcoming[0].start))addDivider(y)}addItem(e)});
  addDivider('Completed');
  if(!completed.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Nothing completed yet.';root.appendChild(empty)}
  completed.forEach(e=>addItem(e,true));
}
render();
setInterval(render,60*60*1000);
</script>
</body>
</html>
